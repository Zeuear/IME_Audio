name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Linux 之前编译不过：官方预编译的 sherpa-onnx 静态库用的是 libstdc++ 旧 ABI，
    # 与 Ubuntu 系统 GCC 的新 ABI 在 std::string 参数上符号名不一致（undefined reference
    # to AddPunctuation）。改为让 SherpaPunctuator 走纯 char* 的 C 接口，避开这个
    # ABI 敏感的调用，而不是给整个 target 切 ABI。
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Qt6 
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.*'
          arch: ${{ matrix.os == 'macos-latest' && 'clang_64' || (matrix.os == 'windows-latest' && 'win64_msvc2022_64' || 'linux_gcc_64') }}
          modules: 'qtmultimedia qtshadertools'

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxcb-xinerama0-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libx11-dev libxext-dev libxtst-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Run unit tests
        run: |
          cd build
          ctest -C Release --output-on-failure
