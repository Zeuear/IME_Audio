name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'


permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest  
            platform: windows
            asset_name: ImeAudio_Windows_x64.exe 
          # - os: ubuntu-22.04
          #   platform: linux
          #   asset_name: ImeAudio-x86_64.AppImage
          - os: macos-latest
            platform: macos
            asset_name: ImeAudio_macOS.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.10.*'
          host: ${{ matrix.platform == 'macos' && 'mac' || matrix.platform }}
          target: 'desktop'
          arch: ${{ matrix.platform == 'macos' && 'clang_64' || (matrix.platform == 'windows' && 'win64_msvc2022_64' || 'linux_gcc_64') }}
          modules: 'qtmultimedia qtshadertools'

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux Dependencies (Linux Only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          sudo apt-get install -y libgl1-mesa-dev libxcb-xinerama0-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 \
            libxkbcommon-x11-0 wget imagemagick

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "macos" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} 
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }}
          fi

      - name: Build Project
        run: cmake --build build --config Release

      # ---- WINDOWS 打包 ----
      - name: Deploy & Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          windeployqt --release --compiler-runtime app/Release/ImeAudio.exe
          iscc installer.iss
          mv dist/Installer/ImeAudio_Setup.exe ./ImeAudio_Windows_x64.exe


      # ---- MACOS 打包 ----
      - name: Deploy & Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          APP_BUNDLE=$(find app -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "❌ 未找到 .app bundle"
            find app -maxdepth 3
            exit 1
          fi
          echo "✅ 找到 app bundle: $APP_BUNDLE"

          macdeployqt "$APP_BUNDLE" -dmg
          DMG_FILE=$(find "$(dirname "$APP_BUNDLE")" -maxdepth 1 -name "*.dmg" | head -n 1)
          mv "$DMG_FILE" ./ImeAudio_macOS.dmg

      # ---- LINUX 打包 ----
      - name: Deploy & Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          IME_AUDIO_BIN="app/ImeAudio"
          if [ ! -f "$IME_AUDIO_BIN" ]; then
            echo "❌ 未找到 $IME_AUDIO_BIN"
            find . -maxdepth 3 -name "ImeAudio" -type f
            exit 1
          fi

          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          # 检查 qmake 是否存在
          export QMAKE=$(which qmake6 || which qmake || true)
          if [ -z "$QMAKE" ]; then
            echo "❌ 找不到 qmake / qmake6，请确认 Qt 已正确安装并加入 PATH"
            which -a qmake qmake6 2>/dev/null || true
            exit 1
          fi
          echo "Using QMAKE=$QMAKE"
          
          export VERSION=${{ github.ref_name }}
          export APPIMAGE_EXTRACT_AND_RUN=1

          # 检查 qml 目录是否存在，避免变量指向空目录
          if [ -d "$(pwd)/qml" ]; then
            export QML_SOURCES_PATHS="$(pwd)/qml"
          elif [ -d "$(pwd)/src" ]; then
            export QML_SOURCES_PATHS="$(pwd)/src"
          else
            echo "⚠️ 未找到 qml 源码目录，跳过 QML_SOURCES_PATHS 设置"
          fi
          echo "QML_SOURCES_PATHS=${QML_SOURCES_PATHS:-<unset>}"

          rm -rf appdir
          set +e
          mkdir -p resources/deployment/linux
          convert resources/title_icon.png -resize 256x256 resources/ImeAudio.png

          ./linuxdeploy-x86_64.AppImage \
            --appdir=appdir \
            --executable="$IME_AUDIO_BIN" \
            --desktop-file=resources/deployment/linux/ImeAudio.desktop \
            --icon-file=resources/ImeAudio.png \
            --plugin qt \
            --output appimage \
            --verbosity=2
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ linuxdeploy 失败，退出码 $EXIT_CODE"
            echo "appdir 结构："
            find appdir -maxdepth 4 -ls || true
            exit $EXIT_CODE
          fi

          # 重命名输出
          APPIMAGE_FILE=$(find . -maxdepth 1 -name "*.AppImage" ! -name "linuxdeploy*" | head -n 1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "❌ AppImage not produced"
            find . -maxdepth 3 -type f -ls
            exit 1
          fi
          mv "$APPIMAGE_FILE" ImeAudio-x86_64.AppImage

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          draft: true 
