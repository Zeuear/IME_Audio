name: Translate Worker

# 本地翻译 worker（tools/translate_worker）依赖 bergamot-translator，本地编译要装一堆依赖、耗时很长。
# 这里在 CI 上为各平台编好，打 translate-worker-v* 标签时发布到同名 Release；
# 主工程 configure 时按 src/CMakeLists.txt 里的 TRANSLATE_WORKER_VERSION 自动下载，开发者不用自己编。
#
# 发布新版本：改完 worker 后推一个标签，例如 git tag translate-worker-v1 && git push origin translate-worker-v1，
# 然后把 src/CMakeLists.txt 的 TRANSLATE_WORKER_VERSION 改成对应版本号。

on:
  push:
    tags:
      - 'translate-worker-v*'
    branches:
      - '**'
    paths:
      - 'tools/translate_worker/**'
      - '.github/workflows/translate-worker.yml'
  pull_request:
    paths:
      - 'tools/translate_worker/**'
      - '.github/workflows/translate-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 固定 bergamot-translator 版本，保证各平台、各次构建结果一致
  BERGAMOT_REPO: https://github.com/browsermt/bergamot-translator.git
  BERGAMOT_REF: 9271618ebbdc5d21ac4dc4df9e72beb7ce644774
  # 各平台（macOS 除外）统一用 OpenBLAS（BSD 许可）。不用 MKL：其许可不便随软件再分发。
  # DYNAMIC_ARCH 运行时按 CPU 选核；USE_LOCKING 让单线程版 OpenBLAS 被多个翻译线程同时调用时也安全；
  # marian 还用到少量 LAPACK（dsyev、sgeqrf），没有 Fortran 编译器时用 C_LAPACK 编出 C 版 LAPACK。
  # 新版 CMake 拒绝 sentencepiece 等子模块过老的 cmake_minimum_required，靠 CMAKE_POLICY_VERSION_MINIMUM 放行
  OPENBLAS_REF: v0.3.28

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: windows-x64
          - os: ubuntu-22.04      # 旧一点的 glibc，生成的二进制在新发行版上也能跑
            asset: linux-x64
          - os: macos-14
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch bergamot-translator
        shell: bash
        run: |
          git clone --filter=blob:none "$BERGAMOT_REPO" bergamot
          cd bergamot
          git checkout "$BERGAMOT_REF"
          # 只取编译用得到的子模块；marian 自带的 examples / regression-tests / fbgemm 等很大，用不上
          git submodule update --init --depth 1 3rd_party/marian-dev 3rd_party/ssplit-cpp
          git -C 3rd_party/marian-dev submodule update --init --recursive --depth 1 \
            src/3rd_party/sentencepiece src/3rd_party/intgemm src/3rd_party/ruy \
            src/3rd_party/simd_utils src/3rd_party/onnxjs
          # 把 worker 挂到 bergamot 的 app 目录下，才能直接链接 bergamot-translator 及其静态依赖
          printf '\nadd_subdirectory(%s translate_worker)\n' "$(cd ../tools/translate_worker && pwd -W 2>/dev/null || pwd)" >> app/CMakeLists.txt

      # ---------------- Windows：自编 OpenBLAS 静态库 + vcpkg 的 pcre2，静态 CRT（/MT） ----------------
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # OpenBLAS 的汇编核心要用 clang-cl 编（MSVC cl 只能编通用 C 核心，且不支持 DYNAMIC_ARCH）；
        # CRT 与 bergamot 一致用 /MT，否则链接时运行库冲突
        run: |
          git clone --depth 1 -b $env:OPENBLAS_REF https://github.com/OpenMathLib/OpenBLAS.git openblas
          cmake -S openblas -B openblas-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DNOFORTRAN=ON -DBUILD_WITHOUT_LAPACK=OFF -DC_LAPACK=ON `
            -DUSE_THREAD=OFF -DUSE_OPENMP=OFF -DUSE_LOCKING=ON -DDYNAMIC_ARCH=ON `
            -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DBUILD_TESTING=OFF `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/openblas-install"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build openblas-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install openblas-build
          Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE/openblas-install/lib"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install pcre2:x64-windows-static

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # BUILD_ARCH=x86-64-v2 对应 /arch:SSE2：不要求 AVX2，老 CPU 也能运行；
        # 矩阵乘法核心（intgemm、OpenBLAS）运行时按 CPU 自动选指令集，速度不受影响
        run: |
          cmake -S bergamot -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release -DUSE_STATIC_LIBS=ON -DBUILD_ARCH=x86-64-v2 -DUSE_MKL=OFF `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/openblas-install" `
            -DCOMPILE_TESTS=OFF -DCOMPILE_UNIT_TESTS=OFF -DGIT_SUBMODULE=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      # ---------------- Linux：自编 OpenBLAS 静态库（DYNAMIC_ARCH 运行时选核，USE_LOCKING 保证多线程调用安全） ----------------
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev
          git clone --depth 1 -b "$OPENBLAS_REF" https://github.com/OpenMathLib/OpenBLAS.git openblas
          cmake -S openblas -B openblas-build -DCMAKE_BUILD_TYPE=Release \
            -DNOFORTRAN=ON -DBUILD_WITHOUT_LAPACK=OFF -DC_LAPACK=ON \
            -DUSE_THREAD=OFF -DUSE_OPENMP=OFF -DUSE_LOCKING=ON -DDYNAMIC_ARCH=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build openblas-build -j"$(nproc)"
          sudo cmake --install openblas-build

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        # 不用 BUILD_ARCH=native，否则会带上构建机的 AVX512 等指令，换台机器就崩
        run: |
          cmake -S bergamot -B build -DCMAKE_BUILD_TYPE=Release -DUSE_STATIC_LIBS=ON \
            -DBUILD_ARCH=x86-64 -DUSE_MKL=OFF -DCOMPILE_TESTS=OFF -DCOMPILE_UNIT_TESTS=OFF -DGIT_SUBMODULE=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      # ---------------- macOS：系统自带 Accelerate 作 BLAS ----------------
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pcre2

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" = "arm64" ]; then ARCH=armv8-a; else ARCH=x86-64; fi
          cmake -S bergamot -B build -DCMAKE_BUILD_TYPE=Release -DUSE_STATIC_LIBS=ON \
            -DBUILD_ARCH="$ARCH" -DUSE_MKL=OFF -DUSE_APPLE_ACCELERATE=ON -DUSE_FBGEMM=OFF \
            -DCOMPILE_TESTS=OFF -DCOMPILE_UNIT_TESTS=OFF -DGIT_SUBMODULE=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.4 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix pcre2)"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target translate_worker -j4

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          BIN=$(find build -type f \( -name translate_worker.exe -o -name translate_worker \) -perm -u+x | head -n 1)
          [ -n "$BIN" ] || { echo "translate_worker not found"; find build -name 'translate_worker*'; exit 1; }
          cp "$BIN" out/
          ls -la out
          # 冒烟测试：启动后应先输出就绪行，stdin 关闭即退出
          if [ "$RUNNER_OS" = "Windows" ]; then W=out/translate_worker.exe; else W=out/translate_worker; fi
          echo -n | "$W" | head -n 1
          if [ "$RUNNER_OS" = "Linux" ]; then ldd "$W" || true; fi
          if [ "$RUNNER_OS" = "macOS" ]; then otool -L "$W"; fi
          cd out && cmake -E tar cf "../translate_worker-${{ matrix.asset }}.zip" --format=zip -- *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: translate_worker-${{ matrix.asset }}
          path: translate_worker-${{ matrix.asset }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/translate-worker-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          name: Translate worker ${{ github.ref_name }}
          body: 本地翻译 worker 的预编译版本，由 ImeAudio 构建时自动下载，不需要手动安装。
          prerelease: true
