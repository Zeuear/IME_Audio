<!doctype html>
<meta charset="utf-8">
<title>ImeAudio</title>
<style>
  body { font: 14px sans-serif; margin: 0; padding: 14px; width: 300px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  input { width: 100%; box-sizing: border-box; padding: 6px; margin: 6px 0; }
  button { padding: 6px 12px; cursor: pointer; }
  #status { margin: 0 0 10px; color: #555; }
  #hint { color: #888; font-size: 12px; margin: 8px 0 0; }
  a { color: #06c; cursor: pointer; font-size: 12px; }
  [hidden] { display: none; }
</style>
<body>
<h1>ImeAudio · Google 文档输出</h1>
<div id="pair" hidden>
  <p style="margin:0">在 ImeAudio 横条右键菜单点“复制 Google 文档配对码”，粘贴到下面（只需一次）。</p>
  <input id="token" autocomplete="off" placeholder="配对码">
  <button id="save">保存并绑定当前标签页</button>
</div>
<div id="main" hidden>
  <p id="status"></p>
  <button id="toggle"></button>
  <p><a id="repair">修改配对码</a></p>
</div>
<p id="hint">绑定期间 Chrome 会显示“正在调试此浏览器”横幅，请勿点“取消”。</p>
<script src="popup.js"></script>
